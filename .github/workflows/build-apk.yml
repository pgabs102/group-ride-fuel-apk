
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Capacitor & Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Group Ride Fuel" "com.groupride.fuel" --web-dir www
          npx cap add android

      - name: Add GPS Permissions
        run: |
          node -e '
            const fs = require("fs");
            const path = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(path, "utf8");
            const perms = `
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-permission android:name="android.permission.INTERNET" />
`;
            if (!xml.includes("ACCESS_FINE_LOCATION")) {
              xml = xml.replace("<application", perms + "\n    <application");
              fs.writeFileSync(path, xml);
            }
          '

      - name: Build Debug APK
        run: |
          npx cap copy android
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroupRideFuel-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
