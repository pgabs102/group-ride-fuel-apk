
<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Ride Fuel & GPS Monitor</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    #map { flex: 1; width: 100%; min-height: 200px; background: #0b1220; }

    .topbar {
      position: fixed; top: 10px; left: 10px; right: 10px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;
      pointer-events: none;
    }
    .pill {
      pointer-events: auto;
      padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
      border: 1px solid #334155; background: rgba(15, 23, 42, 0.92);
    }
    .pill.online { color: #4ade80; border-color: #16a34a; }
    .pill.offline { color: #fbbf24; border-color: #d97706; }

    .panel {
      background: #1e293b; padding: 12px 14px; border-top: 1px solid #334155;
      display: flex; flex-direction: column; gap: 9px; max-height: 68vh; overflow-y: auto;
    }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }

    .rider-bar {
      display: grid; grid-template-columns: 1fr 1.2fr; gap: 6px;
    }
    select, input, button {
      background: #0f172a; color: #f8fafc; border: 1px solid #475569;
      padding: 6px 9px; border-radius: 6px; font-size: 12px;
    }
    button { cursor: pointer; font-weight: 600; }
    button:active { transform: scale(0.97); }
    button.danger { border-color: #ef4444; color: #fca5a5; }
    button.primary { border-color: #22c55e; color: #86efac; }

    .bars { display: flex; gap: 5px; align-items: flex-end; height: 38px; margin-top: 4px; }
    .bar {
      flex: 1; min-width: 24px; max-width: 34px; border-radius: 4px; background: #334155;
      transition: 0.2s; cursor: pointer; border: 1px solid #475569;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #cbd5e1;
    }
    .bar.active { background: #22c55e; border-color: #4ade80; color: #052e16; }
    .bar.low { background: #f59e0b; border-color: #fbbf24; color: #451a03; }
    .bar.blink { background: #ef4444; border-color: #fca5a5; color: #fff; animation: blinkAnim 0.75s infinite; }
    @keyframes blinkAnim { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    .badge { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #334155; }
    .badge.blink { background: #dc2626; animation: blinkAnim 0.75s infinite; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: #0f172a; padding: 8px; border-radius: 8px; border: 1px solid #334155;
    }
    .stat-box { text-align: center; }
    .stat-label { font-size: 10px; color: #94a3b8; }
    .stat-val { font-size: 14px; font-weight: 700; margin-top: 2px; }

    .controls { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .mini-field { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #cbd5e1; }
    .mini-field input { width: 52px; padding: 5px 6px; }

    .guide-box {
      background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px;
    }
    .guide-title {
      font-size: 11px; font-weight: 700; color: #38bdf8; margin-bottom: 6px;
      display: flex; justify-content: space-between; gap: 6px;
    }
    .guide-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .guide-item {
      padding: 5px 6px; border-radius: 6px; background: #1e293b; border: 1px solid #334155;
      font-size: 11px; cursor: pointer;
    }
    .guide-item.current { border-color: #22c55e; background: #14532d55; }
    .guide-item.reserve { border-color: #ef4444; background: #7f1d1d44; }
    .guide-item strong { display: block; font-size: 11px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div id="netPill" class="pill">NET: CHECKING</div>
    <div id="syncPill" class="pill" style="color:#cbd5e1;">QUEUE: 0</div>
    <div id="gpsPill" class="pill" style="color:#94a3b8;">GPS: WAITING</div>
  </div>

  <div id="map"></div>

  <div class="panel">
    <!-- RIDER NAME + MOTORCYCLE GAUGE PRESET -->
    <div class="rider-bar">
      <input id="riderNameInput" type="text" placeholder="Rider Name (hal. Ponce)" onchange="saveRiderMeta()" />
      <select id="bikeSelect" onchange="onBikeChange()"></select>
    </div>

    <!-- GAUGE BARS + LITERS -->
    <div class="row">
      <div style="flex:1;">
        <div id="bikeSpecLabel" style="font-size:11px;color:#94a3b8;">5.5L TANK • TAP BAR TO SET</div>
        <div class="bars" id="barsContainer"></div>
      </div>
      <div style="text-align:right;">
        <span id="statusBadge" class="badge">AUTO TRACKING</span>
        <div style="font-size:19px;font-weight:800;margin-top:3px;">
          <span id="litersText">2.80</span> L <small style="font-size:12px;color:#94a3b8;">(<span id="barText">3</span>/<span id="maxBarText">6</span>)</small>
        </div>
      </div>
    </div>

    <!-- LIVE ODOMETER & RANGE -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Natakbo (Odo)</div>
        <div class="stat-val"><span id="odoText">0.00</span> km</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Bago Mag-Blink</div>
        <div class="stat-val" style="color:#fbbf24;"><span id="toBlinkKmText">0.0</span> km</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Total Sagad Range</div>
        <div class="stat-val" style="color:#4ade80;"><span id="totalRangeText">0.0</span> km</div>
      </div>
    </div>

    <!-- MANUAL & CUSTOM TUNING CONTROLS -->
    <div class="controls">
      <button onclick="adjustBar(-1)">-1 Bar</button>
      <button onclick="adjustBar(1)">+1 Bar</button>
      <button class="danger" onclick="setBlinkState()">Set Blink</button>
      <button onclick="simulateRun(1)">Test +1km</button>
      <button class="primary" onclick="flushOnlineQueue()">Sync</button>

      <label class="mini-field">
        km/L: <input id="kmlInput" type="number" step="1" onchange="updateCustomParams()" />
      </label>
      <label class="mini-field">
        Blink(L): <input id="blinkInput" type="number" step="0.05" onchange="updateCustomParams()" />
      </label>
    </div>

    <!-- CLICKABLE BAR-TO-LITER GUIDE -->
    <div class="guide-box">
      <div class="guide-title">
        <span id="guideTitleText">LITER GUIDE PER BAR</span>
        <span id="blinkGuideNote" style="color:#fca5a5;">Blink = ~1.15 L</span>
      </div>
      <div class="guide-grid" id="guideGrid"></div>
    </div>
  </div>

  <script>
    // =========================================================
    // 1. SUPABASE CONFIG (Ilagay ang URL at Anon Key mo rito)
    // =========================================================
    const SUPABASE_URL = '';      // hal. 'https://xxxx.supabase.co'
    const SUPABASE_ANON_KEY = ''; // iyong Supabase public anon key
    const SUPABASE_TABLE = 'group_ride_fuel_status';

    // =========================================================
    // 2. PRESET MOTORCYCLE GAUGES (Puwede pang dagdagan)
    // =========================================================
    const BIKE_PROFILES = {
      click125: {
        name: 'Honda Click 125i (6 Bars • 5.5L)',
        tankLiters: 5.5,
        totalBars: 6,
        blinkLiters: 1.15,
        defaultKml: 48,
        bars: [
          { bar: 6, label: '6 Bars (Full)', liters: 5.50 },
          { bar: 5, label: '5 Bars',        liters: 4.55 },
          { bar: 4, label: '4 Bars',        liters: 3.70 },
          { bar: 3, label: '3 Bars',        liters: 2.80 },
          { bar: 2, label: '2 Bars',        liters: 1.80 },
          { bar: 1, label: '1 Bar (BLINK)', liters: 1.15 }
        ]
      },
      nmax155: {
        name: 'Yamaha NMAX 155 (6 Bars • 7.1L)',
        tankLiters: 7.1,
        totalBars: 6,
        blinkLiters: 1.40,
        defaultKml: 40,
        bars: [
          { bar: 6, label: '6 Bars (Full)', liters: 7.10 },
          { bar: 5, label: '5 Bars',        liters: 5.90 },
          { bar: 4, label: '4 Bars',        liters: 4.75 },
          { bar: 3, label: '3 Bars',        liters: 3.60 },
          { bar: 2, label: '2 Bars',        liters: 2.40 },
          { bar: 1, label: '1 Bar (BLINK)', liters: 1.40 }
        ]
      },
      aerox155: {
        name: 'Yamaha Aerox 155 (6 Bars • 5.5L)',
        tankLiters: 5.5,
        totalBars: 6,
        blinkLiters: 1.10,
        defaultKml: 42,
        bars: [
          { bar: 6, label: '6 Bars (Full)', liters: 5.50 },
          { bar: 5, label: '5 Bars',        liters: 4.50 },
          { bar: 4, label: '4 Bars',        liters: 3.60 },
          { bar: 3, label: '3 Bars',        liters: 2.70 },
          { bar: 2, label: '2 Bars',        liters: 1.80 },
          { bar: 1, label: '1 Bar (BLINK)', liters: 1.10 }
        ]
      },
      mioi125: {
        name: 'Yamaha Mio i 125 (5 Bars • 4.2L)',
        tankLiters: 4.2,
        totalBars: 5,
        blinkLiters: 0.90,
        defaultKml: 45,
        bars: [
          { bar: 5, label: '5 Bars (Full)', liters: 4.20 },
          { bar: 4, label: '4 Bars',        liters: 3.35 },
          { bar: 3, label: '3 Bars',        liters: 2.50 },
          { bar: 2, label: '2 Bars',        liters: 1.65 },
          { bar: 1, label: '1 Bar (BLINK)', liters: 0.90 }
        ]
      },
      adv160: {
        name: 'Honda ADV 160 (6 Bars • 8.1L)',
        tankLiters: 8.1,
        totalBars: 6,
        blinkLiters: 1.50,
        defaultKml: 43,
        bars: [
          { bar: 6, label: '6 Bars (Full)', liters: 8.10 },
          { bar: 5, label: '5 Bars',        liters: 6.75 },
          { bar: 4, label: '4 Bars',        liters: 5.40 },
          { bar: 3, label: '3 Bars',        liters: 4.05 },
          { bar: 2, label: '2 Bars',        liters: 2.70 },
          { bar: 1, label: '1 Bar (BLINK)', liters: 1.50 }
        ]
      },
      custom5: {
        name: 'Custom Motor (5 Bars • 5.0L)',
        tankLiters: 5.0,
        totalBars: 5,
        blinkLiters: 1.00,
        defaultKml: 40,
        bars: [
          { bar: 5, label: '5 Bars (Full)', liters: 5.00 },
          { bar: 4, label: '4 Bars',        liters: 4.00 },
          { bar: 3, label: '3 Bars',        liters: 3.00 },
          { bar: 2, label: '2 Bars',        liters: 2.00 },
          { bar: 1, label: '1 Bar (BLINK)', liters: 1.00 }
        ]
      }
    };

    // =========================================================
    // 3. STATE & STORAGE INITIALIZATION
    // =========================================================
    const STORAGE_KEY = 'group_ride_fuel_state_v1';
    const QUEUE_KEY = 'group_ride_fuel_queue_v1';

    let riderId = localStorage.getItem('group_ride_rider_id');
    if (!riderId) {
      riderId = 'rider_' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('group_ride_rider_id', riderId);
    }

    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    let riderName = saved?.riderName || 'Rider 1';
    let bikeKey = saved?.bikeKey && BIKE_PROFILES[saved.bikeKey] ? saved.bikeKey : 'click125';
    let currentLiters = saved?.currentLiters ?? 2.80;
    let blinkLiters = saved?.blinkLiters ?? BIKE_PROFILES[bikeKey].blinkLiters;
    let kmPerLiter = saved?.kmPerLiter ?? BIKE_PROFILES[bikeKey].defaultKml;
    let odoKm = saved?.odoKm ?? 0;
    let routeCoords = Array.isArray(saved?.routeCoords) ? saved.routeCoords : [];
    let pendingQueue = JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]');
    let lastPoint = routeCoords.length ? routeCoords[routeCoords.length - 1] : null;
    let mapLoadedOnline = false;

    // Populate Bike Selector
    const bikeSelect = document.getElementById('bikeSelect');
    Object.entries(BIKE_PROFILES).forEach(([key, prof]) => {
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = prof.name;
      bikeSelect.appendChild(opt);
    });

    document.getElementById('riderNameInput').value = riderName;
    bikeSelect.value = bikeKey;
    document.getElementById('kmlInput').value = kmPerLiter;
    document.getElementById('blinkInput').value = blinkLiters;

    // =========================================================
    // 4. SERVICE WORKER (OFFLINE CACHE)
    // =========================================================
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // =========================================================
    // 5. MAPLIBRE SETUP (OFFLINE & ONLINE SAFE)
    // =========================================================
    const ONLINE_STYLE = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json';
    const OFFLINE_STYLE = {
      version: 8,
      sources: {},
      layers: [{ id: 'bg', type: 'background', paint: { 'background-color': '#0b1220' } }]
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: navigator.onLine ? ONLINE_STYLE : OFFLINE_STYLE,
      center: lastPoint || [121.0437, 14.4081],
      zoom: 15
    });

    function ensureTrackLayer() {
      if (!map.getStyle()) return;
      if (!map.getSource('motor-track')) {
        map.addSource('motor-track', {
          type: 'geojson',
          data: { type: 'Feature', geometry: { type: 'LineString', coordinates: routeCoords } }
        });
        map.addLayer({
          id: 'motor-track-line',
          type: 'line',
          source: 'motor-track',
          paint: { 'line-color': '#22c55e', 'line-width': 5 }
        });
      } else {
        map.getSource('motor-track').setData({
          type: 'Feature',
          geometry: { type: 'LineString', coordinates: routeCoords }
        });
      }
    }

    map.on('styledata', ensureTrackLayer);
    map.on('load', () => {
      ensureTrackLayer();
      startGpsMonitor();
      if (navigator.onLine) {
        mapLoadedOnline = true;
        flushOnlineQueue();
      }
    });

    // =========================================================
    // 6. SAVE, QUEUE & AUTO-UPDATE ONLINE
    // =========================================================
    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        riderName,
        bikeKey,
        currentLiters,
        blinkLiters,
        kmPerLiter,
        odoKm,
        routeCoords: routeCoords.slice(-500)
      }));
      localStorage.setItem(QUEUE_KEY, JSON.stringify(pendingQueue));
      updateQueueBadge();
    }

    function buildPayload() {
      const profile = BIKE_PROFILES[bikeKey];
      const activeBar = getCurrentBarNumber(currentLiters);
      const isBlinking = currentLiters <= blinkLiters;
      const kmBeforeBlink = Math.max(0, currentLiters - blinkLiters) * kmPerLiter;

      return {
        rider_id: riderId,
        rider_name: riderName.trim() || 'Rider',
        bike_model: profile.name,
        total_bars: profile.totalBars,
        current_bar: activeBar,
        is_blinking: isBlinking,
        remaining_liters: Number(currentLiters.toFixed(3)),
        blink_threshold_liters: Number(blinkLiters.toFixed(3)),
        km_per_liter: Number(kmPerLiter),
        km_before_blink: Number(kmBeforeBlink.toFixed(1)),
        odo_km: Number(odoKm.toFixed(3)),
        lat: lastPoint ? lastPoint[1] : null,
        lng: lastPoint ? lastPoint[0] : null,
        updated_at: new Date().toISOString()
      };
    }

    function enqueueSnapshot() {
      // Panatilihin ang pinakabagong state sa queue (at i-save offline)
      const snap = buildPayload();
      pendingQueue = [snap];
      saveLocal();
    }

    function updateQueueBadge() {
      const pill = document.getElementById('syncPill');
      pill.textContent = pendingQueue.length ? `PENDING: ${pendingQueue.length}` : 'SYNCED';
      pill.style.color = pendingQueue.length ? '#fbbf24' : '#4ade80';
    }

    async function flushOnlineQueue() {
      if (!navigator.onLine) return;
      const syncPill = document.getElementById('syncPill');

      if (!pendingQueue.length) {
        syncPill.textContent = 'SYNCED';
        syncPill.style.color = '#4ade80';
        return;
      }

      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        // Local mode (wala pang Supabase URL/Key): i-clear ang queue at markahan na updated
        pendingQueue = [];
        saveLocal();
        syncPill.textContent = 'LOCAL UPDATED';
        syncPill.style.color = '#4ade80';
        return;
      }

      syncPill.textContent = 'SYNCING...';
      syncPill.style.color = '#38bdf8';

      try {
        const latest = pendingQueue[pendingQueue.length - 1];
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=rider_id`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(latest)
        });

        if (res.ok) {
          pendingQueue = [];
          saveLocal();
          syncPill.textContent = 'ONLINE SYNCED';
          syncPill.style.color = '#4ade80';
        }
      } catch (err) {
        updateQueueBadge();
      }
    }

    function updateNetBadge() {
      const pill = document.getElementById('netPill');
      if (navigator.onLine) {
        pill.textContent = 'ONLINE';
        pill.className = 'pill online';
      } else {
        pill.textContent = 'OFFLINE (CACHED)';
        pill.className = 'pill offline';
      }
    }

    window.addEventListener('online', async () => {
      updateNetBadge();
      renderGauge();
      if (!mapLoadedOnline) {
        mapLoadedOnline = true;
        map.setStyle(ONLINE_STYLE);
      }
      await flushOnlineQueue();
    });

    window.addEventListener('offline', () => {
      updateNetBadge();
      renderGauge();
    });

    updateNetBadge();
    updateQueueBadge();

    // =========================================================
    // 7. BIKE PROFILE & GAUGE LOGIC
    // =========================================================
    function saveRiderMeta() {
      riderName = document.getElementById('riderNameInput').value || 'Rider';
      enqueueSnapshot();
      if (navigator.onLine) flushOnlineQueue();
    }

    function onBikeChange() {
      bikeKey = bikeSelect.value;
      const prof = BIKE_PROFILES[bikeKey];
      blinkLiters = prof.blinkLiters;
      kmPerLiter = prof.defaultKml;
      // Default sa gitnang bar (hal. Bar 3)
      const midBar = prof.bars.find(b => b.bar === Math.ceil(prof.totalBars / 2)) || prof.bars[0];
      currentLiters = midBar.liters;
      odoKm = 0;

      document.getElementById('kmlInput').value = kmPerLiter;
      document.getElementById('blinkInput').value = blinkLiters;

      enqueueSnapshot();
      renderGauge();
      if (navigator.onLine) flushOnlineQueue();
    }

    function getCurrentBarNumber(liters) {
      const prof = BIKE_PROFILES[bikeKey];
      if (liters <= blinkLiters) return 1;
      // Hanapin ang pinakamalapit na bar mula sa baba pataas
      const sortedAsc = [...prof.bars].sort((a, b) => a.bar - b.bar);
      for (let i = 1; i < sortedAsc.length; i++) {
        const prev = sortedAsc[i - 1];
        const curr = sortedAsc[i];
        const midpoint = (prev.liters + curr.liters) / 2;
        if (liters < midpoint) return prev.bar;
      }
      return prof.totalBars;
    }

    function setManualBar(barNum) {
      const prof = BIKE_PROFILES[bikeKey];
      const found = prof.bars.find(b => b.bar === barNum);
      if (!found) return;
      currentLiters = barNum === 1 ? blinkLiters : found.liters;
      odoKm = 0;
      enqueueSnapshot();
      renderGauge();
      if (navigator.onLine) flushOnlineQueue();
    }

    function adjustBar(delta) {
      const prof = BIKE_PROFILES[bikeKey];
      const cur = getCurrentBarNumber(currentLiters);
      const next = Math.max(1, Math.min(prof.totalBars, cur + delta));
      setManualBar(next);
    }

    function setBlinkState() {
      currentLiters = blinkLiters;
      odoKm = 0;
      enqueueSnapshot();
      renderGauge();
      if (navigator.onLine) flushOnlineQueue();
    }

    function updateCustomParams() {
      kmPerLiter = Math.max(5, parseFloat(document.getElementById('kmlInput').value) || 40);
      blinkLiters = Math.max(0.1, parseFloat(document.getElementById('blinkInput').value) || 1.0);
      enqueueSnapshot();
      renderGauge();
      if (navigator.onLine) flushOnlineQueue();
    }

    let lastSyncKm = Math.floor(odoKm);
    function consumeDistance(stepKm) {
      if (stepKm <= 0) return;
      odoKm += stepKm;
      currentLiters = Math.max(0, currentLiters - (stepKm / kmPerLiter));

      const wholeKm = Math.floor(odoKm);
      if (wholeKm > lastSyncKm || currentLiters <= blinkLiters) {
        lastSyncKm = wholeKm;
        enqueueSnapshot();
        if (navigator.onLine) flushOnlineQueue();
      } else {
        saveLocal();
      }
      renderGauge();
    }

    function simulateRun(km) {
      consumeDistance(km);
    }

    // =========================================================
    // 8. RENDER UI
    // =========================================================
    function renderGauge() {
      const prof = BIKE_PROFILES[bikeKey];
      const container = document.getElementById('barsContainer');
      container.innerHTML = '';

      const activeBar = getCurrentBarNumber(currentLiters);
      const isBlinking = currentLiters <= blinkLiters;

      document.getElementById('bikeSpecLabel').textContent =
        `${prof.tankLiters}L TANK • ${prof.totalBars} BARS • TAP TO SET`;
      document.getElementById('maxBarText').textContent = prof.totalBars;

      for (let i = 1; i <= prof.totalBars; i++) {
        const div = document.createElement('div');
        div.className = 'bar';
        div.style.height = `${14 + i * 3.5}px`;
        div.textContent = i;
        div.onclick = () => setManualBar(i);

        if (isBlinking && i === 1) {
          div.classList.add('blink');
        } else if (i <= activeBar) {
          div.classList.add(activeBar <= 2 ? 'low' : 'active');
        }
        container.appendChild(div);
      }

      const kmBeforeBlink = Math.max(0, currentLiters - blinkLiters) * kmPerLiter;
      const totalSagadKm = currentLiters * kmPerLiter;

      document.getElementById('litersText').textContent = currentLiters.toFixed(2);
      document.getElementById('barText').textContent = isBlinking ? 'BLINK' : activeBar;
      document.getElementById('odoText').textContent = odoKm.toFixed(2);
      document.getElementById('toBlinkKmText').textContent = isBlinking ? '0.0' : kmBeforeBlink.toFixed(1);
      document.getElementById('totalRangeText').textContent = totalSagadKm.toFixed(1);
      document.getElementById('blinkGuideNote').textContent = `Blink = ~${blinkLiters.toFixed(2)} L naiwan`;

      const badge = document.getElementById('statusBadge');
      if (currentLiters <= 0) {
        badge.textContent = 'SAGAD / EMPTY!';
        badge.className = 'badge blink';
      } else if (isBlinking) {
        badge.textContent = `BLINKING (${currentLiters.toFixed(2)}L)`;
        badge.className = 'badge blink';
      } else {
        badge.textContent = navigator.onLine ? 'ONLINE AUTO' : 'OFFLINE CACHED';
        badge.className = 'badge';
      }

      // Render Guide Cards
      const guideGrid = document.getElementById('guideGrid');
      guideGrid.innerHTML = '';
      [...prof.bars].reverse().forEach(item => {
        const litersVal = item.bar === 1 ? blinkLiters : item.liters;
        const estKm = Math.round(litersVal * kmPerLiter);
        const card = document.createElement('div');
        card.className = 'guide-item' +
          (item.bar === 1 ? ' reserve' : '') +
          (item.bar === activeBar ? ' current' : '');
        card.onclick = () => setManualBar(item.bar);
        card.innerHTML = `
          <strong>${item.label}</strong>
          <span style="color:#e2e8f0;">${litersVal.toFixed(2)} L</span>
          <span style="color:#94a3b8;display:block;">~${estKm} km takbo</span>
        `;
        guideGrid.appendChild(card);
      });
    }

    // =========================================================
    // 9. GPS DISTANCE MONITOR
    // =========================================================
    function getDistanceKm(a, b) {
      const [lng1, lat1] = a, [lng2, lat2] = b;
      const R = 6371, rad = d => (d * Math.PI) / 180;
      const dLat = rad(lat2 - lat1), dLng = rad(lng2 - lng1);
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    function startGpsMonitor() {
      const gpsPill = document.getElementById('gpsPill');
      if (!navigator.geolocation) {
        gpsPill.textContent = 'GPS: N/A';
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          const { longitude, latitude, accuracy, speed } = pos.coords;
          gpsPill.textContent = `GPS ±${Math.round(accuracy)}m`;
          gpsPill.style.color = accuracy <= 25 ? '#4ade80' : '#fbbf24';
          if (accuracy > 30) return;

          const pt = [longitude, latitude];
          const speedKmh = speed !== null && speed >= 0 ? speed * 3.6 : 0;

          if (lastPoint) {
            const stepKm = getDistanceKm(lastPoint, pt);
            if (stepKm >= 0.004 && stepKm <= 0.2 && (speedKmh >= 4 || stepKm >= 0.01)) {
              routeCoords.push(pt);
              consumeDistance(stepKm);
              ensureTrackLayer();
            }
          } else {
            routeCoords.push(pt);
            enqueueSnapshot();
            ensureTrackLayer();
          }

          lastPoint = pt;
          map.panTo(pt);
        },
        () => {
          gpsPill.textContent = 'GPS: NO FIX';
          gpsPill.style.color = '#f87171';
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    renderGauge();
  </script>
</body>
